<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-label="Desktop browser mockup of Basim Kazmi Portfolio with Cream, Silver, and Magenta theme">
  <!-- Desktop Browser Chrome -->
  <rect width="1200" height="750" rx="12" fill="#18181b"/>
  <rect x="0" y="0" width="1200" height="44" rx="12" fill="#27272a"/>
  <!-- Window buttons -->
  <circle cx="28" cy="22" r="5" fill="#ef4444"/>
  <circle cx="46" cy="22" r="5" fill="#f59e0b"/>
  <circle cx="64" cy="22" r="5" fill="#10b981"/>
  <!-- URL Bar -->
  <rect x="180" y="8" width="840" height="28" rx="6" fill="#18181b" stroke="#3f3f46" stroke-width="1"/>
  <text x="600" y="26" fill="#d4d4d8" font-family="monospace" font-size="12" text-anchor="middle">https://basimkazmi.github.io/cs554-portfolio_ADWeb_Assignmet1/</text>

  <!-- Browser Content Viewport -->
  <g transform="translate(0, 44)">
    <rect width="1200" height="706" fill="#faf7f2"/>
    <!-- Site Header -->
    <rect width="1200" height="65" fill="#ffffff" stroke="#d4d4d8" stroke-width="1"/>
    <text x="80" y="40" fill="#be185d" font-family="system-ui, sans-serif" font-size="20" font-weight="bold">Basim Kazmi</text>
    <!-- Nav Links -->
    <text x="880" y="38" fill="#be185d" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Home</text>
    <text x="940" y="38" fill="#3f3f46" font-family="system-ui, sans-serif" font-size="14" font-weight="500">Projects</text>
    <text x="1010" y="38" fill="#3f3f46" font-family="system-ui, sans-serif" font-size="14" font-weight="500">Contact</text>
    <!-- Theme Toggle -->
    <rect x="1080" y="18" width="70" height="28" rx="14" fill="#f0ece3" stroke="#d4d4d8" stroke-width="1"/>
    <text x="1115" y="36" fill="#18181b" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">☀️ Light</text>

    <!-- Hero Section -->
    <text x="120" y="150" fill="#be185d" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" letter-spacing="1">HI THERE, I AM</text>
    <text x="120" y="200" fill="#18181b" font-family="system-ui, sans-serif" font-size="44" font-weight="800">Basim Kazmi</text>
    <text x="120" y="240" fill="#3f3f46" font-family="system-ui, sans-serif" font-size="20" font-weight="600">Software Engineer &amp; Systems Developer</text>
    <text x="120" y="280" fill="#52525b" font-family="system-ui, sans-serif" font-size="15">Building intelligent machine learning pipelines, compiler frontends, and accessible</text>
    <text x="120" y="304" fill="#52525b" font-family="system-ui, sans-serif" font-size="15">web systems. Passionate about algorithms, robust data pipelines, and web standards.</text>

    <!-- CTAs -->
    <rect x="120" y="340" width="160" height="42" rx="4" fill="#be185d"/>
    <text x="200" y="366" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Explore Projects</text>
    <rect x="295" y="340" width="140" height="42" rx="4" fill="none" stroke="#d4d4d8" stroke-width="1.5"/>
    <text x="365" y="366" fill="#18181b" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Get in Touch</text>

    <!-- Profile Avatar with Cream/Silver/Magenta -->
    <g transform="translate(860, 120)">
      <circle cx="110" cy="110" r="110" fill="#fbcfe8" stroke="#be185d" stroke-width="3"/>
      <circle cx="110" cy="90" r="42" fill="#faf7f2" stroke="#d4d4d8" stroke-width="2"/>
      <path d="M45 195 Q110 150 175 195 Z" fill="#18181b"/>
    </g>

    <!-- Projects Grid Preview Banner -->
    <rect x="80" y="445" width="1040" height="215" rx="8" fill="#ffffff" stroke="#d4d4d8" stroke-width="1"/>
    <text x="110" y="485" fill="#18181b" font-family="system-ui, sans-serif" font-size="18" font-weight="bold">Featured GitHub Repositories</text>
    
    <!-- Real project card 1 -->
    <rect x="110" y="510" width="310" height="120" rx="6" fill="#faf7f2" stroke="#d4d4d8" stroke-width="1"/>
    <text x="130" y="540" fill="#be185d" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">Solar Power Efficiency</text>
    <text x="130" y="565" fill="#52525b" font-family="system-ui, sans-serif" font-size="11">Random Forest pipeline predicting efficiency.</text>
    <rect x="130" y="590" width="60" height="20" rx="3" fill="#fdf2f8" stroke="#fbcfe8" stroke-width="1"/>
    <text x="160" y="604" fill="#9d174d" font-family="monospace" font-size="10" text-anchor="middle">Python</text>

    <!-- Real project card 2 -->
    <rect x="445" y="510" width="310" height="120" rx="6" fill="#faf7f2" stroke="#d4d4d8" stroke-width="1"/>
    <text x="465" y="540" fill="#be185d" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">Crime AI Solver</text>
    <text x="465" y="565" fill="#52525b" font-family="system-ui, sans-serif" font-size="11">Classical AI heuristic state-space search.</text>
    <rect x="465" y="590" width="60" height="20" rx="3" fill="#fdf2f8" stroke="#fbcfe8" stroke-width="1"/>
    <text x="495" y="604" fill="#9d174d" font-family="monospace" font-size="10" text-anchor="middle">Python</text>

    <!-- Real project card 3 -->
    <rect x="780" y="510" width="310" height="120" rx="6" fill="#faf7f2" stroke="#d4d4d8" stroke-width="1"/>
    <text x="800" y="540" fill="#be185d" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">Semantic Analyzer</text>
    <text x="800" y="565" fill="#52525b" font-family="system-ui, sans-serif" font-size="11">C++ compiler type checking &amp; symbol tables.</text>
    <rect x="800" y="590" width="50" height="20" rx="3" fill="#fdf2f8" stroke="#fbcfe8" stroke-width="1"/>
    <text x="825" y="604" fill="#9d174d" font-family="monospace" font-size="10" text-anchor="middle">C++</text>
  </g>
</svg>