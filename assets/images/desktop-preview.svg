<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-label="Desktop browser mockup of Basim Kazmi Portfolio">
  <!-- Desktop Browser Chrome -->
  <rect width="1200" height="750" rx="16" fill="#0f172a"/>
  <rect x="0" y="0" width="1200" height="48" rx="16" fill="#1e293b"/>
  <!-- Window buttons -->
  <circle cx="28" cy="24" r="6" fill="#ef4444"/>
  <circle cx="48" cy="24" r="6" fill="#f59e0b"/>
  <circle cx="68" cy="24" r="6" fill="#10b981"/>
  <!-- URL Bar -->
  <rect x="180" y="10" width="840" height="28" rx="14" fill="#0f172a"/>
  <text x="600" y="28" fill="#94a3b8" font-family="monospace" font-size="12" text-anchor="middle">https://alexrivera.github.io/portfolio/index.html</text>

  <!-- Browser Content Viewport -->
  <g transform="translate(0, 48)">
    <rect width="1200" height="702" fill="#f8fafc"/>
    <!-- Site Header -->
    <rect width="1200" height="70" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="80" y="44" fill="#1d4ed8" font-family="system-ui, sans-serif" font-size="22" font-weight="bold">Basim Kazmi</text>
    <!-- Nav Links -->
    <text x="880" y="42" fill="#1d4ed8" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Home</text>
    <text x="940" y="42" fill="#475569" font-family="system-ui, sans-serif" font-size="14" font-weight="500">Projects</text>
    <text x="1020" y="42" fill="#475569" font-family="system-ui, sans-serif" font-size="14" font-weight="500">Contact</text>
    <!-- Theme Toggle -->
    <rect x="1090" y="20" width="70" height="30" rx="15" fill="#e2e8f0"/>
    <text x="1125" y="40" fill="#0f172a" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">☀️ Light</text>

    <!-- Hero Section -->
    <text x="120" y="160" fill="#1d4ed8" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" letter-spacing="2">HI THERE, I AM</text>
    <text x="120" y="220" fill="#0f172a" font-family="system-ui, sans-serif" font-size="48" font-weight="800">Basim Kazmi</text>
    <text x="120" y="260" fill="#475569" font-family="system-ui, sans-serif" font-size="22" font-weight="600">Full-Stack Web Developer &amp; Systems Engineer</text>
    <text x="120" y="305" fill="#64748b" font-family="system-ui, sans-serif" font-size="16">I craft accessible, fast, and resilient web experiences. Focused on semantic HTML,</text>
    <text x="120" y="330" fill="#64748b" font-family="system-ui, sans-serif" font-size="16">modern CSS architecture, vanilla JavaScript performance, and reliable backend services.</text>

    <!-- CTAs -->
    <rect x="120" y="370" width="180" height="46" rx="8" fill="#1d4ed8"/>
    <text x="210" y="398" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">Explore Projects</text>
    <rect x="315" y="370" width="160" height="46" rx="8" fill="none" stroke="#cbd5e1" stroke-width="2"/>
    <text x="395" y="398" fill="#0f172a" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">Get in Touch</text>

    <!-- Profile Avatar -->
    <g transform="translate(850, 140)">
      <circle cx="120" cy="120" r="120" fill="#3b82f6" stroke="#1d4ed8" stroke-width="4"/>
      <circle cx="120" cy="95" r="45" fill="#fbcfe8"/>
      <path d="M50 210 Q120 160 190 210 Z" fill="#0f172a"/>
    </g>

    <!-- Skills preview banner -->
    <rect x="80" y="480" width="1040" height="180" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="120" y="525" fill="#0f172a" font-family="system-ui, sans-serif" font-size="20" font-weight="bold">Core Technical Capabilities</text>
    <!-- Cards inside -->
    <rect x="120" y="550" width="300" height="90" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="140" y="580" fill="#1d4ed8" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">Frontend Standards</text>
    <text x="140" y="605" fill="#64748b" font-family="system-ui, sans-serif" font-size="12">Semantic HTML5, CSS Grid, Flexbox, ARIA</text>

    <rect x="450" y="550" width="300" height="90" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="470" y="580" fill="#1d4ed8" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">Zero-Framework JS</text>
    <text x="470" y="605" fill="#64748b" font-family="system-ui, sans-serif" font-size="12">ES6+, Safe DOM APIs, Web Audio, Canvas</text>

    <rect x="780" y="550" width="300" height="90" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="800" y="580" fill="#1d4ed8" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">Reliability &amp; A11y</text>
    <text x="800" y="605" fill="#64748b" font-family="system-ui, sans-serif" font-size="12">WCAG 2.1 AA, Lighthouse 100, W3C 0 errors</text>
  </g>
</svg>