<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" role="img" aria-label="Multiplayer Game Stats Tracker database schema diagram">
  <rect width="600" height="360" fill="#faf7f2"/>
  <rect x="30" y="30" width="540" height="300" rx="8" fill="#ffffff" stroke="#d4d4d8" stroke-width="2"/>
  <text x="300" y="65" fill="#18181b" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Multiplayer Game Stats MySQL Schema</text>
  <!-- Table 1: Players -->
  <g transform="translate(60, 105)">
    <rect width="140" height="150" rx="4" fill="#faf7f2" stroke="#d4d4d8" stroke-width="1.5"/>
    <rect width="140" height="28" rx="4" fill="#be185d"/>
    <text x="70" y="19" fill="#fff" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">Players Table</text>
    <text x="12" y="52" fill="#be185d" font-family="monospace" font-size="10" font-weight="bold">PK player_id</text>
    <text x="12" y="75" fill="#52525b" font-family="monospace" font-size="10">username</text>
    <text x="12" y="98" fill="#52525b" font-family="monospace" font-size="10">rank_score</text>
    <text x="12" y="121" fill="#52525b" font-family="monospace" font-size="10">region</text>
  </g>
  <!-- Table 2: Matches -->
  <g transform="translate(230, 105)">
    <rect width="140" height="150" rx="4" fill="#faf7f2" stroke="#d4d4d8" stroke-width="1.5"/>
    <rect width="140" height="28" rx="4" fill="#be185d"/>
    <text x="70" y="19" fill="#fff" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">Matches Table</text>
    <text x="12" y="52" fill="#be185d" font-family="monospace" font-size="10" font-weight="bold">PK match_id</text>
    <text x="12" y="75" fill="#52525b" font-family="monospace" font-size="10">game_mode</text>
    <text x="12" y="98" fill="#52525b" font-family="monospace" font-size="10">duration_sec</text>
    <text x="12" y="121" fill="#52525b" font-family="monospace" font-size="10">timestamp</text>
  </g>
  <!-- Table 3: Performance -->
  <g transform="translate(400, 105)">
    <rect width="140" height="150" rx="4" fill="#faf7f2" stroke="#d4d4d8" stroke-width="1.5"/>
    <rect width="140" height="28" rx="4" fill="#be185d"/>
    <text x="70" y="19" fill="#fff" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">Match_Stats</text>
    <text x="12" y="52" fill="#be185d" font-family="monospace" font-size="10" font-weight="bold">FK player_id</text>
    <text x="12" y="75" fill="#be185d" font-family="monospace" font-size="10" font-weight="bold">FK match_id</text>
    <text x="12" y="98" fill="#52525b" font-family="monospace" font-size="10">kills / deaths</text>
    <text x="12" y="121" fill="#52525b" font-family="monospace" font-size="10">damage_dealt</text>
  </g>
</svg>