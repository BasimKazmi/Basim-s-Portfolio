<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" role="img" aria-label="Syntax Analyzer context free grammar tree diagram">
  <rect width="600" height="360" fill="#faf7f2"/>
  <rect x="30" y="30" width="540" height="300" rx="8" fill="#ffffff" stroke="#d4d4d8" stroke-width="2"/>
  <text x="300" y="65" fill="#18181b" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Syntax Analysis &amp; Parse Tree in C++</text>
  <!-- Parse Tree Hierarchy -->
  <g transform="translate(250, 95)">
    <rect width="100" height="32" rx="4" fill="#be185d"/>
    <text x="50" y="21" fill="#fff" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">&lt;Expr&gt;</text>
  </g>
  <line x1="280" y1="127" x2="190" y2="175" stroke="#be185d" stroke-width="2"/>
  <line x1="320" y1="127" x2="410" y2="175" stroke="#be185d" stroke-width="2"/>
  <g transform="translate(140, 175)">
    <rect width="100" height="32" rx="4" fill="#fdf2f8" stroke="#be185d" stroke-width="1.5"/>
    <text x="50" y="21" fill="#be185d" font-family="monospace" font-size="12" text-anchor="middle">&lt;Term&gt;</text>
  </g>
  <g transform="translate(360, 175)">
    <rect width="100" height="32" rx="4" fill="#fdf2f8" stroke="#be185d" stroke-width="1.5"/>
    <text x="50" y="21" fill="#be185d" font-family="monospace" font-size="12" text-anchor="middle">&lt;Factor&gt;</text>
  </g>
  <line x1="190" y1="207" x2="140" y2="255" stroke="#d4d4d8" stroke-width="2"/>
  <line x1="190" y1="207" x2="240" y2="255" stroke="#d4d4d8" stroke-width="2"/>
  <rect x="100" y="255" width="80" height="28" rx="4" fill="#e4e4e7"/>
  <text x="140" y="274" fill="#18181b" font-family="monospace" font-size="12" text-anchor="middle">id (x)</text>
  <rect x="200" y="255" width="80" height="28" rx="4" fill="#e4e4e7"/>
  <text x="240" y="274" fill="#18181b" font-family="monospace" font-size="12" text-anchor="middle">op (+)</text>
</svg>