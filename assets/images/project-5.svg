<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" role="img" aria-label="Kanban task board UI mockup">
  <rect width="600" height="360" fill="#0f172a"/>
  <rect x="40" y="30" width="520" height="300" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <circle cx="70" cy="55" r="6" fill="#ef4444"/>
  <circle cx="90" cy="55" r="6" fill="#eab308"/>
  <circle cx="110" cy="55" r="6" fill="#22c55e"/>
  <text x="300" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14" text-anchor="middle">Agile Task Management Board</text>
  <!-- Column 1: To Do -->
  <rect x="60" y="85" width="145" height="225" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="75" y="110" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">To Do (2)</text>
  <rect x="70" y="125" width="125" height="50" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <rect x="80" y="138" width="80" height="8" rx="4" fill="#38bdf8"/>
  <rect x="80" y="152" width="50" height="6" rx="3" fill="#64748b"/>
  <!-- Column 2: In Progress -->
  <rect x="225" y="85" width="145" height="225" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="240" y="110" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">In Progress (1)</text>
  <rect x="235" y="125" width="125" height="50" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <rect x="245" y="138" width="90" height="8" rx="4" fill="#f59e0b"/>
  <rect x="245" y="152" width="60" height="6" rx="3" fill="#64748b"/>
  <!-- Column 3: Done -->
  <rect x="390" y="85" width="145" height="225" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="405" y="110" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">Done (3)</text>
  <rect x="400" y="125" width="125" height="45" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
  <rect x="410" y="138" width="85" height="8" rx="4" fill="#10b981"/>
  <rect x="400" y="180" width="125" height="45" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
  <rect x="410" y="193" width="70" height="8" rx="4" fill="#10b981"/>
</svg>