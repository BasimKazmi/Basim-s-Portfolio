<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844" role="img" aria-label="Mobile browser mockup of Alex Rivera Portfolio at 390px viewport">
  <!-- Mobile Device Shell -->
  <rect width="390" height="844" rx="40" fill="#0f172a"/>
  <!-- Screen Area -->
  <rect x="12" y="12" width="366" height="820" rx="32" fill="#f8fafc"/>
  <!-- Dynamic Island / Speaker notch -->
  <rect x="135" y="20" width="120" height="26" rx="13" fill="#0f172a"/>

  <!-- Mobile Site Header -->
  <g transform="translate(12, 55)">
    <rect width="366" height="60" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="20" y="38" fill="#1d4ed8" font-family="system-ui, sans-serif" font-size="18" font-weight="bold">Alex Rivera</text>
    <!-- Theme Toggle -->
    <rect x="285" y="17" width="60" height="26" rx="13" fill="#e2e8f0"/>
    <text x="315" y="34" fill="#0f172a" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">☀️ Light</text>
  </g>

  <!-- Mobile Viewport Content -->
  <g transform="translate(24, 130)">
    <!-- Avatar -->
    <circle cx="171" cy="55" r="45" fill="#3b82f6" stroke="#1d4ed8" stroke-width="3"/>
    <circle cx="171" cy="45" r="18" fill="#fbcfe8"/>
    <path d="M142 90 Q171 70 200 90 Z" fill="#0f172a"/>

    <!-- Hero Text -->
    <text x="171" y="125" fill="#1d4ed8" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" letter-spacing="1">HI THERE, I AM</text>
    <text x="171" y="155" fill="#0f172a" font-family="system-ui, sans-serif" font-size="26" font-weight="800" text-anchor="middle">Alex Rivera</text>
    <text x="171" y="180" fill="#475569" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Full-Stack Web Developer</text>

    <text x="171" y="215" fill="#64748b" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Crafting accessible, fast, and standards-compliant</text>
    <text x="171" y="235" fill="#64748b" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">web systems with zero bloated frameworks.</text>

    <!-- CTAs Stacked for Mobile -->
    <rect x="30" y="260" width="282" height="42" rx="8" fill="#1d4ed8"/>
    <text x="171" y="286" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Explore Projects</text>

    <rect x="30" y="312" width="282" height="42" rx="8" fill="none" stroke="#cbd5e1" stroke-width="2"/>
    <text x="171" y="338" fill="#0f172a" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Get in Touch</text>

    <!-- Project Card Preview -->
    <rect x="10" y="375" width="322" height="280" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="10" y="375" width="322" height="120" rx="12" fill="#0f172a"/>
    <text x="171" y="440" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Web Audio Synthesizer</text>

    <text x="25" y="520" fill="#0f172a" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">Real-time Audio DSP</text>
    <text x="25" y="542" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">FFT spectrum visualizer &amp; polyphonic synth.</text>

    <rect x="25" y="560" width="75" height="22" rx="4" fill="#e0f2fe"/>
    <text x="62" y="575" fill="#0369a1" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">JavaScript</text>

    <rect x="110" y="560" width="95" height="22" rx="4" fill="#e0f2fe"/>
    <text x="157" y="575" fill="#0369a1" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">Web Audio API</text>

    <rect x="25" y="600" width="110" height="34" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="80" y="622" fill="#0f172a" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">View Details</text>
  </g>
</svg>