<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" role="img" aria-label="DDoS Attack Detection Machine Learning model visualization">
  <rect width="600" height="360" fill="#faf7f2"/>
  <rect x="30" y="30" width="540" height="300" rx="8" fill="#ffffff" stroke="#d4d4d8" stroke-width="2"/>
  <text x="300" y="65" fill="#18181b" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Network Anomaly &amp; DDoS Classification</text>
  <!-- Incoming Packets -->
  <g transform="translate(80, 110)">
    <rect x="0" y="20" width="90" height="26" rx="4" fill="#fdf2f8" stroke="#be185d" stroke-width="1.5"/>
    <text x="45" y="37" fill="#be185d" font-family="monospace" font-size="11" text-anchor="middle">SYN Flood</text>
    <rect x="0" y="65" width="90" height="26" rx="4" fill="#fdf2f8" stroke="#be185d" stroke-width="1.5"/>
    <text x="45" y="82" fill="#be185d" font-family="monospace" font-size="11" text-anchor="middle">UDP Flood</text>
    <rect x="0" y="110" width="90" height="26" rx="4" fill="#f4f4f5" stroke="#a1a1aa" stroke-width="1.5"/>
    <text x="45" y="127" fill="#52525b" font-family="monospace" font-size="11" text-anchor="middle">HTTP Get</text>
  </g>
  <!-- Filter Matrix / ML Model -->
  <rect x="230" y="125" width="130" height="110" rx="8" fill="#be185d"/>
  <text x="295" y="170" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">ML Classifier</text>
  <text x="295" y="195" fill="#fbcfe8" font-family="monospace" font-size="11" text-anchor="middle">Feature Vector</text>
  <!-- Outputs -->
  <line x1="360" y1="150" x2="430" y2="140" stroke="#be185d" stroke-width="2.5"/>
  <line x1="360" y1="210" x2="430" y2="220" stroke="#15803d" stroke-width="2.5"/>
  <rect x="430" y="125" width="100" height="30" rx="4" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="480" y="145" fill="#b91c1c" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Blocked Attack</text>
  <rect x="430" y="205" width="100" height="30" rx="4" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
  <text x="480" y="225" fill="#15803d" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Clean Traffic</text>
</svg>