<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" role="img" aria-label="AST Code Linter parser visualization">
  <rect width="600" height="360" fill="#0f172a"/>
  <rect x="40" y="30" width="520" height="300" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <circle cx="70" cy="55" r="6" fill="#ef4444"/>
  <circle cx="90" cy="55" r="6" fill="#eab308"/>
  <circle cx="110" cy="55" r="6" fill="#22c55e"/>
  <text x="300" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14" text-anchor="middle">Abstract Syntax Tree (AST) Explorer</text>
  <!-- Tree Structure -->
  <g transform="translate(250, 90)">
    <rect width="100" height="36" rx="6" fill="#3b82f6"/>
    <text x="50" y="23" fill="#fff" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">Program</text>
  </g>
  <line x1="270" y1="126" x2="160" y2="170" stroke="#64748b" stroke-width="2"/>
  <line x1="330" y1="126" x2="430" y2="170" stroke="#64748b" stroke-width="2"/>
  <g transform="translate(100, 170)">
    <rect width="120" height="36" rx="6" fill="#10b981"/>
    <text x="60" y="23" fill="#fff" font-family="monospace" font-size="12" text-anchor="middle">FunctionDecl</text>
  </g>
  <g transform="translate(370, 170)">
    <rect width="120" height="36" rx="6" fill="#8b5cf6"/>
    <text x="60" y="23" fill="#fff" font-family="monospace" font-size="12" text-anchor="middle">ReturnStatement</text>
  </g>
  <line x1="160" y1="206" x2="120" y2="250" stroke="#64748b" stroke-width="2"/>
  <line x1="160" y1="206" x2="200" y2="250" stroke="#64748b" stroke-width="2"/>
  <g transform="translate(70, 250)">
    <rect width="90" height="30" rx="4" fill="#0284c7"/>
    <text x="45" y="20" fill="#fff" font-family="monospace" font-size="11" text-anchor="middle">Identifier</text>
  </g>
  <g transform="translate(170, 250)">
    <rect width="90" height="30" rx="4" fill="#0284c7"/>
    <text x="45" y="20" fill="#fff" font-family="monospace" font-size="11" text-anchor="middle">BlockStmt</text>
  </g>
</svg>