<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" role="img" aria-label="Solar Power Efficiency prediction diagram">
  <rect width="600" height="360" fill="#faf7f2"/>
  <rect x="30" y="30" width="540" height="300" rx="8" fill="#ffffff" stroke="#d4d4d8" stroke-width="2"/>
  <text x="300" y="65" fill="#18181b" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Solar Energy Forecasting Pipeline</text>
  <!-- Sun -->
  <circle cx="120" cy="140" r="35" fill="#fbcfe8" stroke="#be185d" stroke-width="3"/>
  <circle cx="120" cy="140" r="22" fill="#be185d"/>
  <!-- Solar Panel -->
  <polygon points="210,210 330,210 360,265 180,265" fill="#fdf2f8" stroke="#be185d" stroke-width="2.5"/>
  <line x1="270" y1="210" x2="270" y2="265" stroke="#be185d" stroke-width="1.5"/>
  <line x1="195" y1="237" x2="345" y2="237" stroke="#be185d" stroke-width="1.5"/>
  <!-- Forecasting Regression Curve -->
  <path d="M 380 250 Q 440 120 480 180 T 540 130" fill="none" stroke="#be185d" stroke-width="4"/>
  <circle cx="480" cy="180" r="5" fill="#be185d"/>
  <circle cx="540" cy="130" r="5" fill="#be185d"/>
  <text x="460" y="275" fill="#52525b" font-family="monospace" font-size="12" text-anchor="middle">Random Forest Regressor</text>
</svg>