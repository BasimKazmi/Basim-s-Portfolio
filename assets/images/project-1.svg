<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" role="img" aria-label="Web Audio Synthesizer interface diagram">
  <rect width="600" height="360" fill="#0f172a"/>
  <rect x="40" y="30" width="520" height="300" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <circle cx="70" cy="55" r="6" fill="#ef4444"/>
  <circle cx="90" cy="55" r="6" fill="#eab308"/>
  <circle cx="110" cy="55" r="6" fill="#22c55e"/>
  <text x="300" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14" text-anchor="middle">Oscilloscope &amp; Spectrum Visualizer</text>
  <!-- Sound Waves -->
  <path d="M 60 190 Q 110 90, 160 190 T 260 190 T 360 190 T 460 190 T 540 190" fill="none" stroke="#38bdf8" stroke-width="4"/>
  <path d="M 60 190 Q 110 120, 160 190 T 260 190 T 360 190 T 460 190 T 540 190" fill="none" stroke="#818cf8" stroke-width="2" opacity="0.6"/>
  <!-- Knobs & Controls -->
  <circle cx="140" cy="270" r="26" fill="#334155" stroke="#38bdf8" stroke-width="3"/>
  <line x1="140" y1="270" x2="155" y2="255" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  <circle cx="300" cy="270" r="26" fill="#334155" stroke="#a855f7" stroke-width="3"/>
  <line x1="300" y1="270" x2="300" y2="248" stroke="#a855f7" stroke-width="3" stroke-linecap="round"/>
  <circle cx="460" cy="270" r="26" fill="#334155" stroke="#22c55e" stroke-width="3"/>
  <line x1="460" y1="270" x2="475" y2="285" stroke="#22c55e" stroke-width="3" stroke-linecap="round"/>
  <text x="140" y="315" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Frequency</text>
  <text x="300" y="315" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Resonance</text>
  <text x="460" y="315" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Gain</text>
</svg>