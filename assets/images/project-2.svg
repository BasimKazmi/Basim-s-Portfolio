<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" role="img" aria-label="Crime AI Classical Search Solver diagram">
  <rect width="600" height="360" fill="#faf7f2"/>
  <rect x="30" y="30" width="540" height="300" rx="8" fill="#ffffff" stroke="#d4d4d8" stroke-width="2"/>
  <text x="300" y="65" fill="#18181b" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Classical AI State Space Solver</text>
  <!-- Graph Tree Nodes -->
  <circle cx="300" cy="115" r="22" fill="#be185d"/>
  <text x="300" y="121" fill="#fff" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">S0</text>
  <line x1="300" y1="137" x2="200" y2="185" stroke="#be185d" stroke-width="3"/>
  <line x1="300" y1="137" x2="400" y2="185" stroke="#d4d4d8" stroke-width="2"/>
  <circle cx="200" cy="195" r="20" fill="#be185d"/>
  <text x="200" y="201" fill="#fff" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">S1</text>
  <circle cx="400" cy="195" r="20" fill="#fdf2f8" stroke="#be185d" stroke-width="2"/>
  <text x="400" y="201" fill="#be185d" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">S2</text>
  <line x1="200" y1="215" x2="150" y2="265" stroke="#be185d" stroke-width="3"/>
  <line x1="200" y1="215" x2="250" y2="265" stroke="#d4d4d8" stroke-width="2"/>
  <circle cx="150" cy="275" r="22" fill="#be185d"/>
  <text x="150" y="281" fill="#fff" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">Goal</text>
  <circle cx="250" cy="275" r="18" fill="#fdf2f8" stroke="#d4d4d8" stroke-width="2"/>
  <text x="380" y="275" fill="#52525b" font-family="monospace" font-size="12">A* &amp; Heuristic Search</text>
</svg>